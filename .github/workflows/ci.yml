name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Inline JS syntax check
        run: node -e "const fs=require('fs'),html=fs.readFileSync('public/index.html','utf8'),m=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];new (require('vm').Script)(m[m.length-1][1]);console.log('inline JS parses OK')"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npx playwright test
