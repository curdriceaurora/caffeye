<script>
  (function() {
    try {
      const saved = localStorage.getItem('caffeye-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();

        if (!m._icon) return;
        if (view && !view.contains([m.shopRef.lat, m.shopRef.lng])) return;
        let pin = m._pinEl;
        let label = m._labelEl;
        if (!pin || !pin.isConnected) {
          pin = m._icon.querySelector('.pin');
          label = m._icon.querySelector('.pin-label');
          m._pinEl = pin;
          m._labelEl = label;
        }
        if (!pin || !label) return;
        items.push({ pin, label, shop: m.shopRef });
      });
    }
    if (!items.length) {
      return;
    }
    // The collision pass below is O(items × angles × obstacles). Clustering keeps
    // this small in practice (dense areas collapse into cluster bubbles), but
    // guard the pathological case — many shops simultaneously unclustered at a
    // zoom level dense enough to matter — rather than block the main thread.
    if (exceedsLabelSafetyCap(items.length)) {
      items.forEach(it => { it.label.style.visibility = 'hidden'; });
      return;
    }
    // Reset transforms to base centered, measure
    // Batch all CSS writes (resets of transform and visibility) to prevent layout thrashing
    items.forEach(it => {
      it.label.style.transform = 'translate(-50%, -50%)';
      it.label.style.visibility = 'visible';
    });

    // Do all getBoundingClientRect() reads in a separate loop
    const measured = items.map(it => {
      const pr = it.pin.getBoundingClientRect();
      const lr = it.label.getBoundingClientRect();
      return {
        it,
        cx: pr.left + pr.width / 2,
        cy: pr.top + pr.height / 2,
        pinR: Math.max(pr.width, pr.height) / 2,
        lw: lr.width, lh: lr.height
      };
    });

    // Seed the obstacle list with everything that's already on the map:
    //  - every individual pin (so a label can't slide over another pin)
    //  - every cluster bubble (so labels avoid the "+N" cluster markers)
    const obstacles = [];
    function pushRect(el, ownerId = null) {
      const r = el.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return;
      obstacles.push({
        left: r.left,
        top: r.top,
        right: r.right,
        bottom: r.bottom,
        ownerId: ownerId
      });
    }
    measured.forEach(m => pushRect(m.it.pin, m.it.shop.id));
    document.querySelectorAll('.coffee-cluster').forEach(el => pushRect(el));

    function rectForAngle(m, angleDeg) {
      const rad = angleDeg * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      // distance so the label's near edge sits LABEL_GAP from the pin's edge
      const horiz = Math.abs(cos) * m.lw / 2;
      const vert = Math.abs(sin) * m.lh / 2;
      const labelExtent = Math.sqrt(horiz * horiz + vert * vert);
      const d = m.pinR + LABEL_GAP + labelExtent;
      const dx = cos * d;
      const dy = -sin * d; // screen y goes down
      const cx = m.cx + dx, cy = m.cy + dy;
      return {
        dx, dy,
        left: cx - m.lw / 2, top: cy - m.lh / 2,
        right: cx + m.lw / 2, bottom: cy + m.lh / 2
      };
    }
    // Priority: higher-weighted shops claim labels first
    measured.sort((a, b) => (b.it.shop.weightedRating || 0) - (a.it.shop.weightedRating || 0));
    measured.forEach(m => {
      let chosen = null;
      // Spatial culling: candidate labels for shop m are strictly bounded within
      // [cx - maxReach, cx + maxReach] × [cy - maxReach, cy + maxReach].
      // Obstacles outside this window can never collide with any candidate angle.
      const maxReach = m.pinR + LABEL_GAP + m.lw + m.lh;
      const minX = m.cx - maxReach, maxX = m.cx + maxReach;
      const minY = m.cy - maxReach, maxY = m.cy + maxReach;
      const nearbyObstacles = obstacles.filter(p => {
        if (p.ownerId === m.it.shop.id) return false;
        return p.right >= minX && p.left <= maxX && p.bottom >= minY && p.top <= maxY;
      });

      for (const angle of LABEL_ANGLES) {
        const r = rectForAngle(m, angle);
        const collides = nearbyObstacles.some(p => {
          return !(r.right <= p.left || r.left >= p.right || r.bottom <= p.top || r.top >= p.bottom);
        });
        if (!collides) {
          chosen = r;
          obstacles.push({
            left: r.left,
            top: r.top,
            right: r.right,
            bottom: r.bottom,
            ownerId: m.it.shop.id
          });
          break;
        }
      }
      if (chosen) {
        m.it.label.style.transform =
          `translate(-50%, -50%) translate(${chosen.dx}px, ${chosen.dy}px)`;
        m.it.label.style.visibility = 'visible';
      } else {
        m.it.label.style.visibility = 'hidden';
      }
    });
  }

  let __labelTimer = null;
  let __labelRaf = null;
  function scheduleLabels() {
    if (vectorRenderer) return;
    clearTimeout(__labelTimer);
    if (__labelRaf) cancelAnimationFrame(__labelRaf);
    __labelTimer = setTimeout(() => {
      __labelRaf = requestAnimationFrame(() => {
        placeLabels();
      });
    }, 60);
  }
  let selectedMarker = null;

  function updatePinSelectedDOM(marker, isSelected) {
    if (!marker) return;
    marker.options.icon = makeIcon(marker.shopRef, isSelected);
    if (marker._icon) {
      let pin = marker._pinEl;
      if (!pin || !pin.isConnected) {
        pin = marker._icon.querySelector('.pin');
        marker._pinEl = pin;
      }
      if (pin) pin.classList.toggle('selected', isSelected);
    }
  }

  function setMarkerSelected(shop) {
    if (vectorRenderer) { vectorRenderer.select(shop); return; }
    const nextMarker = shop ? markerByShopId.get(shop.id) : null;
    if (selectedMarker && selectedMarker !== nextMarker) {
      updatePinSelectedDOM(selectedMarker, false);
      selectedMarker = null;
    }
    if (nextMarker) {
      updatePinSelectedDOM(nextMarker, true);
      selectedMarker = nextMarker;
    }
  }

  // Ensure selection persists when clusters explode/spiderfy and mount marker DOM
  function bindMapListeners(map, clusterGroup) {
    map.on('moveend', onMapMoveEnd);
    map.on('zoomend', onMapMoveEnd);
  map.on('zoomstart', () => {
    clearTimeout(__labelTimer);
    if (__labelRaf) cancelAnimationFrame(__labelRaf);
  });
  map.on('zoomend', () => { toggleLabels(); scheduleLabels(); });
  map.on('moveend', scheduleLabels);
  clusterGroup?.on('animationend spiderfied unspiderfied', scheduleLabels);
  toggleLabels();
  scheduleLabels();

  clusterGroup?.on('layeradd', e => {
    if (e.layer && e.layer.shopRef && state.selected && e.layer.shopRef.id === state.selected.id) {
      updatePinSelectedDOM(e.layer, true);
      selectedMarker = e.layer;
    }
  });
  }
  bindMapListeners(map, clusterGroup);

  // LIST
  const shopListEl = document.getElementById('shopList');
  const resultsCountEl = document.getElementById('resultsCount');
  const resultsLabelEl = document.getElementById('resultsLabel');
  const resultsMetaEl  = document.getElementById('resultsMeta');
  const searchInput = document.getElementById('searchInput');

  // Global filters (category / feature / search / franchise) — these gate BOTH map markers and the list.
  function passesGlobalFilters(s) {
    const term = state.search.toLowerCase().trim();
    if (state.categories.size && !state.categories.has(s.category)) return false;
    if (!state.includeFranchises && s.model === 'franchise') return false;
    const cw = s.cw || {};
    const ln = s.late;
    if (state.features.has('work') && cw.tier !== 'excellent') return false;
    if (state.features.has('meeting') && !cw.hasMeetingRoom) return false;
    if (state.features.has('late') && !ln) return false;
    if (state.features.has('midnight') && (!ln || ln.tier !== 'midnight')) return false;
    if (!term) return true;
    const hay = [
      s.name,
      s.usp,
      s.signature,
      s.category,
      s.neighborhood,
      s.city || '',
      s.county || '',
      s.address || s.addr || '',
      cw.tier || '',
      cw.note || '',
      ln ? ln.tier : '',
      ln ? ln.when : '',
      ...(s.loved || [])
    ].join(' ').toLowerCase();
    const words = term.split(/\s+/);
    return words.every(word => hay.includes(word));
  }

  let cachedGlobalShops = null;
  function updateGlobalFilteredShops() {
    cachedGlobalShops = SHOPS.filter(passesGlobalFilters);
    cachedGlobalShops.sort((a, b) => (b.weightedRating || 0) - (a.weightedRating || 0));
  }

  // Shops eligible to live on the map (global filters only — no viewport).
  function filteredForMap() {
    if (!cachedGlobalShops) updateGlobalFilteredShops();
    return cachedGlobalShops;
  }

  // Shops shown in the right-hand list (global filters + current map viewport).
  function filteredForList() {
    if (!cachedGlobalShops) updateGlobalFilteredShops();
    const view = window.mapReady ? viewBounds() : null;
    if (!view) return cachedGlobalShops;
    return cachedGlobalShops.filter(s => view.contains([s.lat, s.lng]));
  }

  let lastRenderedShopIds = [];
  let lastRenderedSelectedId = null;

  function cardAriaLabel(shop) {
    return `${shop.name}, ${(shop.category || '').replace('+', ' and ')} in ${shop.neighborhood}${shop.rated ? `, score ${shop.scoreText}` : ''}`;
  }
  function buildShopCard(shop) {
    const li = document.createElement('li');
    li.className = 'shop-item' + (state.selected && state.selected.id === shop.id ? ' active' : '');
    li.dataset.id = shop.id;
    li.setAttribute('tabindex', '0');
    li.setAttribute('role', 'button');
    const catStr = shop.category || '';
    li.setAttribute('aria-label', cardAriaLabel(shop));

    const cat = CATS[shop.category] || {};
    const catColor = cat.hex || '#999';
    const catIcon = cat.icon || '';
    const tags = compactTags(shop);
    const tagsHtml = tags.map((t, i) => (i > 0 ? '<span class="tag-sep">·</span>' : '') + escapeHtml(t)).join('');
    const catLabel = escapeHtml(catStr.replace('+', ' & '));
    const ratingHtml = shop.rated
      ? `<span class="score">◆ ${shop.scoreText}</span>`
      : `<span class="muted">no rating</span>`;
    const modelTag = shop.model === 'franchise'
      ? ' · <span class="model-tag franchise">Franchise</span>'
      : ' · <span class="model-tag indie">Indie</span>';
    const curatedTag = shop.curated ? ' · <span class="curated-tag">✔ curated</span>' : '';
    li.innerHTML = `
      <div class="shop-name"><span class="shop-icon-tile" style="background:${catColor}">${catIcon}</span>${escapeHtml(shop.name)}</div>
      <div class="shop-meta">${catLabel} · ${ratingHtml} · ${escapeHtml(shop.neighborhood)}${modelTag}${curatedTag}</div>
      <div class="shop-tags">${tagsHtml}</div>
    `;

    const triggerSelect = () => selectShop(shop);
    li.addEventListener('click', triggerSelect);
    li.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerSelect();
      }
    });
    return li;
  }

  // Fit the map to every globally-matching shop (used by the
  // "outside this view" search action).
  function showAllMatches() {
    if (!cachedGlobalShops || !cachedGlobalShops.length) return;
    if (searchInput) searchInput.blur();
    fitMapToShops(cachedGlobalShops, true);
  }

  // Compact "+N outside view" pill in the results-meta bar. Shown only while
  // some matches are visible and more exist beyond the viewport.
  function updateOutsideMatchesUI(outsideCount, visibleCount) {
    const existing = document.getElementById('outsideMatchesPill');
    if (outsideCount > 0 && visibleCount > 0) {
      if (existing) {
        existing.textContent = `+${outsideCount} outside view`;
        return;
      }
      const pill = document.createElement('button');
      pill.id = 'outsideMatchesPill';
      pill.type = 'button';
      pill.className = 'outside-matches-pill';
      pill.textContent = `+${outsideCount} outside view`;
      pill.addEventListener('click', showAllMatches);
      resultsMetaEl.appendChild(pill);
    } else if (existing) {
      existing.remove();
    }
  }

  function renderList(source) {
    if (source === 'viewport' && state.selected) return;
    // A held reading list survives programmatic moves; a map gesture, filter or search refreshes it.
    if (pendingListUpdate && (source === 'viewport' || source === 'detail-back') && !mapGesture) return;
    if (source === 'filter' || source === 'search') listInteracted = false;
    if (pendingListUpdate) {
      pendingListUpdate = false;
      showCoverageStatus();
      if (source === 'viewport' || source === 'detail-back') source = 'hydrate';
    }
    // A fresh filter/search context starts back at the top of the list;
    // explicit "Load more", returning from detail, and viewport updates preserve pagination.
    if (source === 'filter' || source === 'search' || source === 'hydrate') {
      if (source !== 'hydrate') {
        state.listLimit = LIST_PAGE_SIZE;
        state.savedListLimit = LIST_PAGE_SIZE;
      }
      updateGlobalFilteredShops();

      // Map cluster membership tracks global filters only — viewport filtering must not
      // shrink clusterGroup.getBounds() (otherwise later fitBounds calls fit to a tiny set).
      if (vectorRenderer) {
        vectorRenderer.setShops(cachedGlobalShops);
      } else {
      const mapSet = new Set(cachedGlobalShops);
      const toAdd = [];
      const toRemove = [];
      markers.forEach(m => {
        const shouldBeOnMap = mapSet.has(m.shopRef);
        if (shouldBeOnMap && !m.isOnMap) {
          toAdd.push(m);
          m.isOnMap = true;
        } else if (!shouldBeOnMap && m.isOnMap) {
          toRemove.push(m);
          m.isOnMap = false;
        }
      });
      if (toAdd.length > 0) clusterGroup.addLayers(toAdd);
      if (toRemove.length > 0) clusterGroup.removeLayers(toRemove);
      }
    } else if (source === 'detail-back') {
      if (state.savedListLimit) state.listLimit = state.savedListLimit;
    }

    const filtered = filteredForList();
    const shown = filtered.slice(0, state.listLimit);
    const globalCount = cachedGlobalShops ? cachedGlobalShops.length : SHOPS.length;
    const isViewportFiltering = filtered.length < globalCount;
    const currentSelectedId = state.selected ? state.selected.id : null;

    // Count pop when number changes (Web Animations API: zero forced reflow)
    const prevCount = parseInt(resultsCountEl.textContent) || -1;
    resultsCountEl.textContent = filtered.length;
    if (filtered.length !== prevCount && prevCount !== -1) {
      if (resultsCountEl.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        resultsCountEl.animate([
          { transform: 'scale(1)' },
          { transform: 'scale(1.25)', color: 'var(--accent)' },
          { transform: 'scale(1)', color: 'inherit' }
        ], { duration: 250, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
      }
    }

    // Label and pulse: "N in view" vs "N spots" (Web Animations API: zero forced reflow)
    resultsLabelEl.textContent = isViewportFiltering ? ' in view' : ' spots';    if (source === 'viewport') {
      if (resultsMetaEl.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        resultsMetaEl.animate([
          { background: 'var(--accent-soft)' },
          { background: 'transparent' }
        ], { duration: 350, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
      }
    }

    // Search matches beyond the viewport: offer a one-tap expansion instead
    // of a dead end. cachedGlobalShops holds every global match; filtered is
    // the in-viewport subset.
    const searchActive = state.search.trim() !== '';
    const outsideCount = searchActive ? (globalCount - filtered.length) : 0;
    updateOutsideMatchesUI(outsideCount, filtered.length);

    // Fast-path: if displayed ordered IDs, selection state, and list count are identical, skip DOM reconciliation
    let idsMatch = shown.length === lastRenderedShopIds.length;
    if (idsMatch) {
      for (let i = 0; i < shown.length; i++) {
        if (shown[i].id !== lastRenderedShopIds[i]) {
          idsMatch = false;
          break;
        }
      }
    }

    if (idsMatch && lastRenderedSelectedId === currentSelectedId && source === 'viewport') {
      if (typeof scheduleLabels === 'function') scheduleLabels();
      return;
    }

    // Keyed DOM reconciliation
    if (filtered.length === 0) {
      shopListEl.innerHTML = '<li class="empty-state"><img src="./brand/logos/caffeye-symbol-forest.svg" alt="" width="28" height="28" style="opacity:0.35;display:block;margin:0 auto 8px;">Nothing here — try zooming out or clearing a filter.</li>';
      if (outsideCount > 0) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        const plural = outsideCount === 1 ? '' : 'es';
        li.innerHTML = `<div>No matches in the current map view — found ${outsideCount} matching spot${outsideCount === 1 ? '' : 's'} elsewhere.</div>`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'action-btn outside-matches-btn';
        btn.textContent = `Show all ${outsideCount} match${plural}`;
        btn.addEventListener('click', showAllMatches);
        li.appendChild(btn);
        shopListEl.appendChild(li);
      }
      lastRenderedShopIds = [];
      lastRenderedSelectedId = currentSelectedId;
      if (typeof scheduleLabels === 'function') scheduleLabels();
      return;
    }

    // Capture focus and scroll anchor before reconciliation
    let focusedShopId = null;
    if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('shop-item')) {
      focusedShopId = document.activeElement.dataset.id;
    }

    let anchorShopId = null;
    let anchorOffset = 0;
    const currentItems = shopListEl.querySelectorAll('.shop-item');
    for (let i = 0; i < currentItems.length; i++) {
      const item = currentItems[i];
      if (item.offsetTop + item.offsetHeight > shopListEl.scrollTop) {
        anchorShopId = item.dataset.id;
        anchorOffset = shopListEl.scrollTop - item.offsetTop;
        break;
      }
    }

    shopListEl.querySelectorAll('.empty-state').forEach(el => el.remove());

    const oldMore = shopListEl.querySelector('.load-more');
    if (oldMore) oldMore.remove();

    // Map existing card elements by data-id
    const existingMap = new Map();
    shopListEl.querySelectorAll('.shop-item').forEach(el => {
      existingMap.set(el.dataset.id, el);
    });

    shown.forEach((shop, i) => {
      const currentChild = shopListEl.children[i];
      let li = existingMap.get(shop.id);
      if (li) {
        existingMap.delete(shop.id);
        // Hydration recomputes Bayesian priors for existing venues, too.
        if (source === 'hydrate') {
          const score = li.querySelector('.score');
          if (score) score.textContent = `◆ ${shop.scoreText}`;
          li.setAttribute('aria-label', cardAriaLabel(shop));
        }
        const shouldBeActive = currentSelectedId === shop.id;
        if (li.classList.contains('active') !== shouldBeActive) {
          li.classList.toggle('active', shouldBeActive);
        }
        li.style.animation = 'none'; // preserve existing node, do not replay entry animation
        if (currentChild !== li) {
          shopListEl.insertBefore(li, currentChild || null);
        }
      } else {
        li = buildShopCard(shop);
        li.style.animationDelay = `${Math.min(i * 20, 100)}ms`;
        shopListEl.insertBefore(li, currentChild || null);
      }
    });

    // Remove nodes that are no longer in the visible slice
    existingMap.forEach(el => el.remove());

    if (filtered.length > shown.length) {
      const more = document.createElement('li');
      more.className = 'load-more';
      const remaining = filtered.length - shown.length;
      const nextBatch = Math.min(remaining, LIST_PAGE_SIZE);
      more.innerHTML = `<button type="button" class="load-more-btn">Load ${nextBatch} more (${remaining} left)</button>`;
      more.querySelector('button').addEventListener('click', () => {
        const firstNewIndex = shown.length;
        state.listLimit += LIST_PAGE_SIZE;
        renderList('loadmore');
        const firstNew = shopListEl.querySelectorAll('.shop-item')[firstNewIndex];
        if (firstNew) firstNew.focus();
      });
      shopListEl.appendChild(more);
    }

    // Preserve scroll anchor and keyboard focus
    if (source === 'filter' || source === 'search') {
      shopListEl.scrollTop = 0;
    } else if (anchorShopId) {
      const anchorEl = shopListEl.querySelector(`[data-id="${anchorShopId}"]`);
      if (anchorEl) {
        shopListEl.scrollTop = anchorEl.offsetTop + anchorOffset;
      }
    }

    if (focusedShopId) {
      const focusedEl = shopListEl.querySelector(`[data-id="${focusedShopId}"]`);
      if (focusedEl && document.activeElement !== focusedEl) {
        focusedEl.focus({ preventScroll: true });
      }
    }

    lastRenderedShopIds = shown.map(s => s.id);
    lastRenderedSelectedId = currentSelectedId;

    if (typeof scheduleLabels === 'function') scheduleLabels();
  }

  // DETAIL
  const panelEl = document.getElementById('panel');
  const detailEl = document.getElementById('detailView');
  const listViewEl = document.getElementById('listView');
  if (detailEl) detailEl.setAttribute('inert', '');

  function renderDetail(shop) {
    const cat = CATS[shop.category] || {};
    const cw = shop.cw && shop.cw.tier ? shop.cw : null;
    const ln = shop.late;
    const site = shop.website;
    const host = websiteHost(site);
    const bft = bestForTags(shop);
    const loved = shop.loved || [];
    const ratingHtml = shop.rated
      ? `<span class="score">◆ ${shop.scoreText}</span><span class="score-label">weighted score</span>` +
        `<span class="google">Google <span class="star">★</span> ${shop.ratingText}${shop.ratingCount ? ' · ' + shop.ratingCount + ' reviews' : ''}</span>`
      : `<span class="muted">No public rating yet</span>`;
    const modelTag = shop.model === 'franchise'
      ? ' · <span class="model-tag franchise">Franchise</span>'
      : ' · <span class="model-tag indie">Indie spot</span>';
    const curatedTag = shop.curated ? ' · <span class="curated-tag">✔ curated</span>' : '';

    let html = `
      <button class="back-btn" id="backBtn">← Back to list</button>
      <div class="detail-header">
        <div class="detail-cat"><span class="dot" style="background:${cat.hex || '#999'}"></span>${escapeHtml(shop.category.replace('+',' & '))} · ${escapeHtml(shop.neighborhood)}${modelTag}${curatedTag}</div>
        <h2 class="detail-name">${escapeHtml(shop.name)}</h2>
        <div class="detail-rating">${ratingHtml}</div>
      </div>
    `;
    if (shop.usp) {
      html += `
        <div class="detail-section">
          <div class="detail-text">${escapeHtml(shop.usp)}</div>
        </div>
      `;
    }
    if (bft.length) {
      html += `<div class="detail-section">
        <div class="detail-section-label">Best for</div>
        <div class="tag-row">${bft.map(t => `<span class="pill-tag feature ${t.cls}">${t.icon ? t.icon + ' ' : ''}${t.label}</span>`).join('')}</div>
      </div>`;
    }
    if (loved.length || shop.signature) {
      html += `<div class="detail-section">
        <div class="detail-section-label">Known for</div>
        ${loved.length ? `<div class="tag-row">${loved.map(l => `<span class="pill-tag">${escapeHtml(l)}</span>`).join('')}</div>` : ''}
        ${shop.signature ? `<div class="detail-text-muted" style="margin-top:8px;">Try the <b>${escapeHtml(shop.signature)}</b>.</div>` : ''}
      </div>`;
    }
    html += `<div class="detail-section">
      <div class="detail-section-label">Location & hours</div>
      <div class="detail-text-muted">${escapeHtml(shop.address || '')}</div>
      ${shop.hours ? `<div class="detail-text-muted" style="margin-top:4px;">${escapeHtml(shop.hours)}</div>` : ''}
    </div>`;
    if (cw) {
      const tierLabel = { excellent: 'Coworking-ready', good: 'Workable', limited: 'Quick-grab' }[cw.tier];
      const prov = cw.verified ? `<div class="detail-text-muted" style="margin-top:6px;font-size:11px;">Verified ${escapeHtml(cw.verified)} · ${escapeHtml(cw.source || 'Editorial review')}</div>` : '';
      html += `<div class="detail-section">
        <div class="detail-section-label">Coworking</div>
        <div class="detail-text"><b>${tierLabel}.</b> ${escapeHtml(cw.note || '')}</div>
        ${cw.hasMeetingRoom ? `<div class="callout">
          <div class="callout-label">Meeting room</div>
          <div class="callout-text">${escapeHtml(cw.meetingRoomNote || 'Private/meeting room available on demand')}</div>
        </div>` : ''}${prov}
      </div>`;
    } else {
      html += `<div class="detail-section">
        <div class="detail-section-label">Work suitability</div>
        <div class="detail-text-muted">Unknown · amenities not yet verified for this venue.</div>
      </div>`;
    }
    if (ln) {
      const lnLabel = ln.tier === 'midnight' ? 'Open until midnight' : 'Open till 10pm+';
      html += `<div class="detail-section">
        <div class="detail-section-label">Late-night</div>
        <div class="detail-text"><b>${lnLabel}.</b> ${escapeHtml(ln.when || '')}</div>
      </div>`;
    }
    const actions = [];
    const gUrl = sanitizeActionUrl(shop.googleUrl);
    const yUrl = sanitizeActionUrl(shop.yelpUrl);
    const wUrl = sanitizeActionUrl(site);
    if (gUrl) actions.push(`<a class="action-btn" href="${gUrl}" target="_blank" rel="noopener">Google Maps</a>`);
    if (yUrl) actions.push(`<a class="action-btn" href="${yUrl}" target="_blank" rel="noopener">Yelp</a>`);
    if (wUrl) actions.push(`<a class="action-btn" href="${wUrl}" target="_blank" rel="noopener">${host}</a>`);
    if (actions.length) {
      html += `<div class="actions">${actions.join('')}</div>`;
    }
    detailEl.innerHTML = html;
    document.getElementById('backBtn').addEventListener('click', deselectShop);
  }

  let selectionToken = 0;
  let cancelReveal = () => {};
  function cancelPendingReveal() {
    selectionToken++;
    cancelReveal();
  }
  // Centre on the marker at zoom 16+, then zoom one level at a time until its cluster
  // splits. Each step waits for the map and cluster animations to finish (moveend /
  // animationend); listeners attach after map.stop() so its synchronous moveend is ignored.
  // Steps run in a fresh task: moving the map inside MarkerCluster's animationend (fired
  // from its queue processor) re-enters that processor and unbalances _inZoomAnimation.
  function revealMarker(marker, token, cb) {
    cancelReveal();
    map.stop();
    if (!marker) return;
    const animate = !reducedMotion();
    const current = () => token === selectionToken && clusterGroup.hasLayer(marker);
    const busy = () => map._animatingZoom || clusterGroup._inZoomAnimation > 0 || (map._panAnim && map._panAnim._inProgress);
    let stepTimer = null;
    const schedule = () => { clearTimeout(stepTimer); stepTimer = setTimeout(reveal, 0); };
    const cleanup = () => {
      clearTimeout(stepTimer);
      map.off('moveend', schedule);
      clusterGroup.off('animationend', schedule);
    };
    cancelReveal = cleanup;
    let centred = false;
    function reveal() {
      if (!current()) { cleanup(); return; }
      if (busy()) return;
      const target = marker.getLatLng();
      const zoom = map.getZoom();
      // Centre once; maxBounds can clamp the centre, so never retry it.
      if (!centred) {
        centred = true;
        if (zoom < 16 || map.distance(map.getCenter(), target) > 1) {
          map.setView(target, Math.max(zoom, 16), { animate });
          return;
        }
      }
      const parent = clusterGroup.getVisibleParent(marker);
      if (parent && parent !== marker && zoom < map.getMaxZoom()) {
        map.setView(target, zoom + 1, { animate });
        return;
      }
      cleanup();
      if (parent && parent !== marker) parent.spiderfy();
      cb();
    }
    map.on('moveend', schedule);
    clusterGroup.on('animationend', schedule);
    reveal();
  }

  function selectShop(shop, opts) {
    opts = opts || {};
    cancelSearchAnnouncement();
    cancelPendingReveal();
    // Apply a pending search now so its timer cannot close the detail being opened.
    if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; renderList('search'); }
    closedByFilter = false;
    // Save scroll position and pagination limit of the list before entering detail mode
    if (!state.selected) {
      state.lastScrollTop = shopListEl.scrollTop;
      state.savedListLimit = state.listLimit;
      state.previousCamera = { center: map.getCenter(), zoom: map.getZoom() };
    }
    state.selected = shop;

    // In-place active class update on list cards
    const prevActive = shopListEl.querySelector('.shop-item.active');
    if (prevActive && (!shop || prevActive.dataset.id !== shop.id)) {
      prevActive.classList.remove('active');
    }
    if (shop) {
      const nextActive = shopListEl.querySelector(`.shop-item[data-id="${shop.id}"]`);
      if (nextActive) nextActive.classList.add('active');
    }

    renderDetail(shop);
    panelEl.classList.add('detail-mode');
    if (listViewEl) listViewEl.setAttribute('inert', '');
    if (detailEl) detailEl.removeAttribute('inert');
    setMarkerSelected(shop);
    // Trigger immediate label placement since the selection ring changed the marker's size
    if (typeof scheduleLabels === 'function') scheduleLabels();

    const backBtn = document.getElementById('backBtn');
    if (backBtn) backBtn.focus();
    if (searchInput) searchInput.blur();
    announce(`Selected ${shop.name} in ${shop.city || shop.neighborhood || 'the region'}. Showing details.`);

    if (opts.recenterMap !== false) {
      if (vectorRenderer) {
        map.stop();
        map.easeTo({ center: [shop.lng, shop.lat], zoom: Math.max(map.getZoom(), 15), duration: reducedMotion() ? 0 : 800, offset: [0, 0] });
      } else {
        const m = markerByShopId.get(shop.id);
        revealMarker(m, selectionToken, () => setMarkerSelected(shop));
      }
    }
  }

  function deselectShop(opts) {
    cancelPendingReveal();
    const skipFit = !!(opts && opts.skipFit);
    const lastSelectedId = state.selected ? state.selected.id : null;
    state.selected = null;
    const prevActive = shopListEl.querySelector('.shop-item.active');
    if (prevActive) prevActive.classList.remove('active');

    panelEl.classList.remove('detail-mode');
    if (listViewEl) listViewEl.removeAttribute('inert');
    if (detailEl) detailEl.setAttribute('inert', '');
    setMarkerSelected(null);
    if (lastSelectedId) announce('Closed details.');
    if (state.savedListLimit) {
      state.listLimit = state.savedListLimit;
    }
    renderList('detail-back');

    // Restore scroll position
    if (state.lastScrollTop !== undefined) {
      shopListEl.scrollTop = state.lastScrollTop;
    }

    // Restore keyboard focus to the list item that was open
    if (lastSelectedId && !(opts && opts.keepFocus)) {
      const el = shopListEl.querySelector(`[data-id="${lastSelectedId}"]`);
      if (el) el.focus({ preventScroll: true });
    }

    const camera = state.previousCamera;
    state.previousCamera = null;
    if (!skipFit && camera) {
      map.stop();
      const token = selectionToken;
      const restore = () => {
        if (token !== selectionToken) return;
        // Only the restoring move's moveend may consume the scroll/focus flag.
        clearTimeout(__viewportTimer);
        state.returningFromDetail = lastSelectedId;
        if (vectorRenderer) map.easeTo({ center: camera.center, zoom: camera.zoom, duration: reducedMotion() ? 0 : 800 });
        else map.setView(camera.center, camera.zoom, { animate: !reducedMotion() });
      };
      // Leaflet ignores setView during a CSS zoom; restore once it ends, outside its event dispatch.
      if (!vectorRenderer && map._animatingZoom) map.once('zoomend', () => setTimeout(restore, 0));
      else restore();
    }
  }

  // Labels use the loaded region; visible counts follow franchise inclusion.
  // Search metadata describes the whole loaded dataset, independent of filters.
  const brandEl = document.querySelector('.brand');
  const freshnessEl = document.querySelector('.freshness');
  // Freshness suffix with per-source attribution. A source whose month is
  // missing or "unknown" contributes nothing — refreshing one dataset must
  // not vouch for the other.
  function freshnessSuffix() {
    const known = m => (m && m !== 'unknown') ? m : '';
    const s = known(SHOPS_MONTH), p = known(PLACES_MONTH);
    if (s && p) {
      return s === p ? ` · verified ${s}` : ` · curated verified ${s} · regional verified ${p}`;
    }
    const hasCurated = SHOPS.some(shop => shop.curated);
    const hasRegional = SHOPS.some(shop => !shop.curated);
    if (s) return ` · ${hasRegional ? 'curated ' : ''}verified ${s}`;
    if (p) return ` · ${hasCurated ? 'regional ' : ''}verified ${p}`;
    return '';
  }
  function updateHeader() {
    const inScope = SHOPS.filter(s => state.includeFranchises || s.model !== 'franchise');
    const count = inScope.length;
    const title = 'Coffee in ' + REGION_LABEL;
    document.title = title;
    const description = `${SHOPS.length.toLocaleString('en-US')} coffee, bakery & tea spots in ${REGION_LABEL}. Filter by work-friendly, meeting room, or late hours.`;
    document.querySelectorAll('meta[name="description"], meta[property="og:description"], meta[name="twitter:description"]').forEach(meta => { meta.content = description; });
    document.querySelectorAll('meta[property="og:title"], meta[name="twitter:title"]').forEach(meta => { meta.content = 'Caffeye — ' + title; });
    if (brandEl) {
      const prefix = document.createElement('span');
      prefix.className = 'brand-prefix';
      prefix.textContent = 'Coffee in ';
      brandEl.replaceChildren(prefix, document.createTextNode(REGION_LABEL));
      document.getElementById('brandHomeBtn').setAttribute('aria-label', `Caffeye — ${title} — Reset filters`);
    }
    if (freshnessEl) {
      freshnessEl.textContent = (dataLoadState.regional === 'loading' && !opts.placesData ? 'Loading Metro Atlanta… ' : '') + count + ' spots in ' + REGION_LABEL + freshnessSuffix();
    }
  }

  // Clear an open detail card whose shop no longer passes global filters
  // (category / feature / search / franchise changed underneath it). Focus
  // stays where the user put it (the chip/toggle just activated); the list
  // re-renders from the render() caller below.
  function syncSelectionToFilters() {
    if (state.selected && !passesGlobalFilters(state.selected)) {
      cancelPendingReveal();
      closedByFilter = true;
      state.selected = null;
      state.previousCamera = null;
      const prevActive = shopListEl.querySelector('.shop-item.active');
      if (prevActive) prevActive.classList.remove('active');
      panelEl.classList.remove('detail-mode');
      if (listViewEl) listViewEl.removeAttribute('inert');
      if (detailEl) detailEl.setAttribute('inert', '');
      setMarkerSelected(null);
    }
  }

  function render() {
    updateHeader();
    renderChips();
    syncSelectionToFilters();
    if (state.selected) renderDetail(state.selected);
    renderList('filter');
    showCoverageStatus();
  }

  let searchTimer = null;
  searchInput.addEventListener('input', e => {
    state.search = e.target.value;
    clearTimeout(searchTimer);
    cancelSearchAnnouncement();
    searchTimer = setTimeout(() => { searchTimer = null; syncSelectionToFilters(); renderList('search'); }, 80);
    searchAnnouncementTimer = setTimeout(() => {
      if (state.selected) return;
      const message = resultsAnnouncement(state.search.trim() ? '' : 'Search cleared. ');
      if (message !== lastSearchAnnouncement) { announce(message); lastSearchAnnouncement = message; }
    }, 700);
  });

  const franchiseToggle = document.getElementById('franchiseToggle');
  if (franchiseToggle) {
    franchiseToggle.checked = state.includeFranchises;
    franchiseToggle.addEventListener('change', e => {
      state.includeFranchises = e.target.checked;
      // Incompatible selections are cleared centrally in render().
      render();
      announceFilterChange(`${state.includeFranchises ? 'Including' : 'Excluding'} franchise stores. `);
    });
  }

  const brandHomeBtn = document.getElementById('brandHomeBtn');
  if (brandHomeBtn) {
    const resetAll = (e) => {
      e.preventDefault();
      state.includeFranchises = false;
      if (franchiseToggle) franchiseToggle.checked = false;
      state.categories.clear();
      state.features.clear();
      state.search = '';
      if (searchInput) searchInput.value = '';
      // Close any open detail without fitting (membership is still stale),
      // rebuild markers for the cleared filters, then fit the full spread.
      cancelSearchAnnouncement();
      deselectShop({ skipFit: true, keepFocus: true });
      render();
      let announced = false;
      const announceReset = () => {
        if (announced) return;
        announced = true;
        clearTimeout(__viewportTimer); // the debounced render would re-anchor the old scroll
        renderList('viewport');
        shopListEl.scrollTop = 0;
        announceFilterChange('Reset filters. ');
      };
      map.once('moveend', () => setTimeout(announceReset, 0));
      setTimeout(announceReset, 1500); // in case the fit does not move the camera
      // While only the seed is loaded, return to the regional frame rather than fitting the seed.
      if (dataLoadState.regional === 'loading') showRegionalFrame(true);
      else fitMapToShops(filteredForMap(), true);
    };
    brandHomeBtn.addEventListener('click', resetAll);
    brandHomeBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') resetAll(e); });
  }

  const themeToggleBtn = document.getElementById('themeToggle');
  function getSystemTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function getCurrentTheme() {
    return document.documentElement.getAttribute('data-theme') || getSystemTheme();
  }
  function updateThemeUI(theme) {
    const isDark = theme === 'dark';
    if (themeToggleBtn) {
      themeToggleBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      themeToggleBtn.setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    const logoImg = document.getElementById('brandLogoImg');
    if (logoImg) {
      logoImg.src = isDark ? './brand/logos/caffeye-symbol-paper.svg' : './brand/logos/caffeye-symbol-forest.svg';
    }
    const meta = document.getElementById('themeColorMeta');
    if (meta) {
      meta.content = isDark ? '#181e19' : '#293F34';
    }
  }

  function applyTheme(theme, isUserManual) {
    document.documentElement.setAttribute('data-theme', theme);
    if (isUserManual) {
      try {
        localStorage.setItem('caffeye-theme', theme);
      } catch (err) {}
    }
    updateThemeUI(theme);
    if (vectorRenderer) vectorRenderer.setTheme(theme);
    if (typeof tileLayer !== 'undefined' && tileLayer) {
      tileLayer.setUrl(getCartoTileUrl(theme));
    }
  }

  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => {
      const next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
      applyTheme(next, true);
    });
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    let saved = null;
    try { saved = localStorage.getItem('caffeye-theme'); } catch (err) {}
    if (!saved) {
      applyTheme(e.matches ? 'dark' : 'light', false);
    }
  });

  updateThemeUI(getCurrentTheme());

  // Coverage status is informational when either dataset is usable.
  // Only startup failure of both sources is a blocking alert.
  let coverageMessage = '', coverageTimer = null, pendingCount = 0;
  const status = document.createElement('div');
  status.id = 'dataStatusBanner';
  status.className = 'data-status-banner';
  status.setAttribute('role', 'status');
  document.querySelector('.layout').append(status);
  function showCoverageStatus() {
    updateHeader();
    const count = SHOPS.filter(s => state.includeFranchises || s.model !== 'franchise').length;
    const focused = status.contains(document.activeElement) ? document.activeElement.id : null;
    const button = (id, label, onclick) => Object.assign(document.createElement('button'), { id, className: 'banner-retry-btn', textContent: label, onclick });
    status.replaceChildren();
    status.classList.toggle('success', coverageMessage === 'ready' && !pendingListUpdate);
    if (pendingListUpdate) {
      status.hidden = false;
      status.append(`${pendingCount} more spot${pendingCount === 1 ? '' : 's'} loaded`, button('updateListBtn', 'Update list', () => {
        pendingListUpdate = false;
        renderList('hydrate');
        showCoverageStatus();
      }));
    } else {
      status.hidden = !coverageMessage && dataLoadState.regional === 'ready' && dataLoadState.seed === 'ready';
      status.append(coverageMessage === 'retry-failed' ? `Retry failed · ${count} spots`
        : coverageMessage === 'ready' ? `Regional coverage loaded · ${count} spots`
        : dataLoadState.regional === 'loading' ? `Loading Metro Atlanta… ${count} spots so far`
        : dataLoadState.regional === 'failed' ? `Regional coverage unavailable · ${count} spots`
        : `Showing regional spots (${count}) · curated picks unavailable`);
      if (dataLoadState.regional === 'failed') status.append(button('retryPlacesBtn', 'Retry', () => retryRegionalLoad()));
    }
    // Rebuilding drops focus from a banner button; keep keyboard users in place.
    if (focused) (document.getElementById(focused) || shopListEl.querySelector('.shop-item') || searchInput).focus({ preventScroll: true });
  }
  let listInteracted = false, pendingListUpdate = false;
  shopListEl.addEventListener('scroll', () => { listInteracted = true; }, { passive: true });
  shopListEl.addEventListener('pointerdown', () => { listInteracted = true; }, { passive: true });

  function hydrateRegion(placesData) {
    const fresh = ingestPlaces(placesData).filter(prepareShop);
    if (fresh.length) {
      SHOPS.push(...fresh);
      spreadCoincidentShops();
      computeWeightedRatings();
      if (clusterGroup) {
        const moved = markers.filter(m => !m.getLatLng().equals([m.shopRef.lat, m.shopRef.lng]));
        clusterGroup.removeLayers(moved);
        moved.forEach(m => m.setLatLng([m.shopRef.lat, m.shopRef.lng]));
        clusterGroup.addLayers(moved.filter(m => m.isOnMap));
      }
    }
    // Also recovers shops from an earlier hydrate that threw before their markers existed.
    addShopMarkers(SHOPS.filter(shop => !markerByShopId.has(shop.id)));
    updateScopes(shopsDataGlobal, placesData);
    window.REGION_LABEL = REGION_LABEL;
    cachedGlobalShops = null;
    dataLoadState.regional = 'ready';
    // The map shows the new data even while a reader's list is held.
    if (vectorRenderer) vectorRenderer.setShops(filteredForMap());
    updateHeader();
    renderChips();
    if (state.selected) {
      const focusedId = document.activeElement?.id;
      const detailScroll = detailEl.scrollTop;
      renderDetail(state.selected);
      detailEl.scrollTop = detailScroll;
      if (focusedId) document.getElementById(focusedId)?.focus({ preventScroll: true });
    }
    // Hold the list only for someone reading it: scrolled, focused in it, or on a detail card.
    pendingListUpdate = listInteracted && (shopListEl.scrollTop > 0 || !!state.selected || shopListEl.contains(document.activeElement));
    pendingCount = fresh.filter(passesGlobalFilters).length;
    mapGesture = false;
    if (!pendingListUpdate) renderList('hydrate');
    // Expand untouched startup/retry views only. Never move a browsing user.
    if (!userHasInteracted && !state.selected) {
      fitMapToShops(filteredForMap());
      if (!pendingListUpdate) { renderList('viewport'); shopListEl.scrollTop = 0; }
    }
    showCoverageStatus();
    trackMetric('regional_ready', { path: 'hydrate', duration_ms: Math.round(performance.now() - vectorStart) });
  }

  let retryInFlight = false;
  retryRegionalLoad = async () => {
    if (retryInFlight) return;
    retryInFlight = true;
    const button = document.getElementById('retryPlacesBtn');
    if (button) { button.disabled = true; button.textContent = 'Loading…'; }
    try {
      const data = await fetchDataset('./places.json', 'places');
      if (!data) throw new Error('Regional load failed');
      hydrateRegion(data);
      coverageMessage = 'ready';
      clearTimeout(coverageTimer);
      coverageTimer = setTimeout(() => { coverageMessage = ''; showCoverageStatus(); }, 4000);
    } catch {
      dataLoadState.regional = 'failed';
      coverageMessage = 'retry-failed';
    } finally {
      retryInFlight = false;
      showCoverageStatus();
    }
  };

  render();
  if (vectorRenderer) {
    vectorRenderer.whenReady.then(() => {
      if (!userHasInteracted && dataLoadState.regional === 'ready') fitMapToShops(filteredForMap());
      window.mapReady = true;
      trackMetric('vector_ready', { duration_ms: Math.round(performance.now() - vectorStart) });
      renderList('viewport');
    });
  }

  // Expose key globals for console testing and the test suite in TESTS.md.
  Object.assign(window, { state, SHOPS, ADDR, NEIGHBORHOODS, CATS, REGION_LABEL, map, markers, clusterGroup, markerByShopId, exceedsLabelSafetyCap, placeLabels, setMarkerSelected, selectShop, deselectShop, ATL_BOUNDS, escapeHtml, tileLayer, applyTheme, getCurrentTheme, getCartoTileUrl });
  return { hydrateRegion, showCoverageStatus };
}

</script>
</body>
</html>
